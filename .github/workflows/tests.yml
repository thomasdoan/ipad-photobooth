name: Tests
on:
  push:
    branches:
      - '**'
    paths:
      - 'fotoX/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fotoX/**'
      - '.github/workflows/tests.yml'
jobs:
  unit-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/swiftpm/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Unit Tests
        run: |
          set -eo pipefail
          xcodebuild test \
            -project fotoX/fotoX.xcodeproj \
            -scheme fotoX \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M3)' \
            -only-testing:fotoXTests \
            -resultBundlePath UnitTests.xcresult \
            2>&1 | xcbeautify --report junit --report-path unit-results.xml

      - name: Publish Unit Test Results
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: unit-results.xml
          check_name: Unit Tests
          include_passed: false

      - name: Upload xcresult
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UnitTests.xcresult
          path: UnitTests.xcresult

  ui-tests:
    runs-on: macos-latest
    if: >
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v5

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/swiftpm/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run UI Tests
        run: |
          set -eo pipefail
          xcodebuild test \
            -project fotoX/fotoX.xcodeproj \
            -scheme fotoX \
            -destination 'platform=iOS Simulator,name=iPad Air 13-inch (M3)' \
            -only-testing:fotoXUITests \
            -resultBundlePath UITests.xcresult \
            2>&1 | xcbeautify --report junit --report-path ui-results.xml

      - name: Publish UI Test Results
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: ui-results.xml
          check_name: UI Tests
          include_passed: false

      - name: Upload xcresult
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: UITests.xcresult
          path: UITests.xcresult
